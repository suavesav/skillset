name: CI

# Test-only. Runs the library validator and the viewer's tests and static
# build on pull requests, so Dependabot bumps and branch pushes get a signal
# before they reach main. Deploys nothing and holds no secrets.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py
      - run: bash platforms/claude-plugin/build.sh --list > /dev/null

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npx nuxi prepare
      - run: npx vitest run
      - run: npx nuxi generate
        env:
          NUXT_APP_BASE_URL: /skillset/
